<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VLTRA Demonlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;family=Oswald:wght@600&amp;display=swap">
<style>
:root{--bg:#fff;--fg:#222;--mut:#666;--card:#fff;--bd:#b5b5b5;--acc:#0a84c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#eee;--mut:#9a9aa8;--card:#15161a;--bd:#4a4b55}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#eee;--mut:#9a9aa8;--card:#15161a;--bd:#4a4b55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:720px;margin:0 auto;padding-bottom:30px}
.logo{font:600 2rem/1 Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;padding:20px 16px}
.logo span{color:var(--acc);font-size:.7em}
.mut{color:var(--mut);font-size:.85rem}
nav{display:flex;border:1px dashed var(--bd);border-left:0;border-right:0}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 12px}
button{cursor:pointer}
.tab{flex:1;background:none;border:0;border-radius:0;padding:14px 4px;font-weight:700;color:var(--mut)}
.tab.on{color:var(--fg);box-shadow:inset 0 -3px var(--acc)}
.btn{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.card{border:1px dashed var(--bd);padding:22px;margin:22px 12px;background:var(--card);overflow-wrap:anywhere}
.card img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent);margin-bottom:-6px}
.card h2{margin:.15em 0;font-size:1.6rem;font-weight:700}
.by{font-size:1.15rem;font-weight:700;color:var(--mut)}
.by b{color:var(--fg);border-bottom:1px dotted currentColor}
.pts{font-size:.85rem;color:var(--mut);margin-top:4px}
.rec{margin-top:12px;font-size:.9rem}
a{color:var(--acc);font-weight:600}
.card img.th{width:44px;height:44px;object-fit:cover;-webkit-mask-image:none;mask-image:none;margin:0 8px 0 0;display:inline-block;vertical-align:middle;border-radius:4px}
.fi{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.b{display:inline-block;cursor:pointer;border:1px solid var(--bd);border-radius:6px;padding:8px 12px}
.skb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;font-size:1.4rem;padding:0;background:#1e1e26;border:1px solid #555;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.sp{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(260px,calc(100vw - 28px));z-index:5;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:#1e1e26;color:#f2f2f2;--fg:#f2f2f2;--card:#2a2a34;--bd:#555;--mut:#bbb;font-size:.9rem}
.sp[hidden]{display:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid #777}
.sp label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp input[type=color]{padding:0;width:44px;height:30px}
.sr{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);padding:4px 8px;margin:16px 0}
.sr input{flex:1;border:0;background:none;padding:6px;min-width:0}
.sr button{border:0;background:none;padding:4px 8px}
.pls{border:1px solid var(--bd);padding:6px 10px}
.pr{display:flex;align-items:center;gap:8px;padding:9px 2px;cursor:pointer}
.pr b{font-weight:800}
.pr i{font-size:.75rem;color:var(--mut)}
.pr.on{box-shadow:inset 3px 0 var(--acc);padding-left:8px}
.pn{display:flex;margin:12px 0}
.pn button{flex:1;background:none;border:0;font-variant:small-caps;font-weight:800;font-size:1.15rem;letter-spacing:.5px}
.pn button:disabled{opacity:.35;cursor:default}
.fl{display:inline-block;width:24px;height:18px;object-fit:cover;flex:none}
.card img.fl{display:inline-block;width:24px;height:18px;-webkit-mask-image:none;mask-image:none;margin:0}
.dt{margin-top:14px;border-top:1px dashed var(--bd);padding-top:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;text-align:center;margin-top:16px}
.g2 h3,.ds h3{margin:0 0 4px;font-size:1.1rem}
.ds{text-align:center;margin-top:22px;line-height:1.8}
.v{color:var(--mut)}
.sb{text-align:center}
.sb h3{margin:28px 0 8px;font-size:1.2rem}
.sb h3:first-child{margin-top:0}
.sb p{margin:0 0 14px;color:var(--mut);font-size:.95rem}
.sb input,.sb select,.sb textarea{width:100%;box-sizing:border-box;text-align:left}
.sb .btn{display:block;margin:18px auto 0;padding:12px 26px}
.form{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.row.sm{padding-left:16px;font-size:.9rem;color:var(--mut)}
</style></head>

const okImg=s=>/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s||'');

const lvl=()=>S.levels.length?S.levels.map((l,i)=>`<div class="card">${okImg(l.img)?`<img src="${l.img}" alt="">`:''}<h2>#${i+1} – ${esc(l.name)}</h2><div class="by">publié par <b>${esc(l.creator)}</b></div><div class="pts">${pts(i)} points</div><div class="rec">${dn(l).length?'<span class="mut">Victors :</span> '+dn(l).map(r=>`<a href="${safe(r.url)}" target="_blank" rel="noopener">${esc(r.p)}</a>`).join(' · '):'<span class="mut">Aucun record pour l’instant</span>'}</div></div>`).join(''):'<p class="mut" style="margin:22px 12px">Aucun niveau.</p>';

const CC='fr be ch lu mc ca us mx br ar cl co pe uy ve ec bo py gb ie de nl es pt it at pl cz sk hu ro bg gr tr se no dk fi is ee lv lt ua ru by rs hr si ba al mk me cy mt ma dz tn eg sn ci cm cd ng za ke et sa ae qa il lb jp kr cn tw hk vn th ph id my sg in pk bd au nz re gp mq gf pf nc'.split(' ');
const cname=c=>{try{return new Intl.DisplayNames(['fr'],{type:'region'}).of(c.toUpperCase())}catch(e){return c.toUpperCase()}};
const cc=p=>{const c=(S.players&&S.players[p]&&S.players[p].c)||'';return /^[a-z]{2}$/.test(c)?c:''};
const flag=p=>{const c=cc(p);return c?`<img class="fl" src="https://flagcdn.com/w40/${c}.png" width="24" height="18" alt="${c.toUpperCase()}" onerror="this.style.visibility='hidden'">`:'<span class="fl"></span>'};
let pq='',pg=0,psel=null;

const isDone=r=>!(+r.pct<100);
const dn=l=>l.records.filter(isDone);
const allPlayers=()=>[...new Set(S.levels.flatMap(l=>l.records.map(r=>r.p.trim())))].sort((x,y)=>x.localeCompare(y,'fr',{sensitivity:'base'}));

function stats(){
  const m={},pend=[];
  S.levels.forEach((l,i)=>l.records.forEach(r=>{
    const k=r.p.trim();
    if(isDone(r)){const o=m[k]||(m[k]={p:k,pts:0,n:0,recs:[],prog:[]});o.pts+=+pts(i);o.n++;o.recs.push({i,name:l.name,url:r.url,pts:pts(i)})}
    else pend.push({k,i,name:l.name,pct:r.pct});
  }));
  pend.forEach(x=>{if(m[x.k])m[x.k].prog.push(x)});
  return Object.values(m).sort((x,y)=>y.pts-x.pts).map(o=>(o.recs.sort((a,b)=>a.i-b.i),o));
}

function detail(){
  const a=stats(),k=a.findIndex(x=>x.p===psel);
  if(k<0)return '<p class="mut" style="text-align:center;margin:18px 0 8px">Clique sur un joueur pour voir ses stats</p>';
  const o=a[k],c=cc(o.p);
  const main=o.recs.filter(r=>r.i<5).length,ext=o.recs.filter(r=>r.i>=5&&r.i<10).length;
  const wt=i=>i<5?800:i<10?600:400;
  const sep=' <span class="mut">-</span> ';
  const done=[...o.recs].sort((x,y)=>x.name.localeCompare(y.name,'fr',{sensitivity:'base'})).map(r=>`<span style="font-weight:${wt(r.i)}">${esc(r.name)}</span>`).join(sep);
  const prog=o.prog.sort((x,y)=>x.i-y.i).map(x=>`${esc(x.name)} <span class="mut">${x.pct}%</span>`).join(sep);
  return `<div class="dt"><h2 style="display:flex;align-items:center;justify-content:center;gap:10px">${flag(o.p)}${esc(o.p)}</h2>${c?`<div class="mut" style="text-align:center">${esc(cname(c))}</div>`:''}<div class="g2"><div><h3>Demonlist rank</h3><div class="v">${k+1}</div></div><div><h3>Demonlist score</h3><div class="v">${o.pts.toFixed(2)}</div></div><div><h3>Demonlist stats</h3><div class="v">${main} Main, ${ext} Extended</div></div><div><h3>Hardest level</h3><div class="v" style="font-weight:800;color:var(--fg)">${esc(o.recs[0].name)}</div></div></div><div class="ds"><h3>Demons completed</h3><div>${done}</div></div><div class="ds"><h3>Progress sur</h3><div class="v">${prog||'Aucun'}</div></div></div>`;
}

const pl=()=>`<div class="card"><h2 style="text-align:center">Stats des joueurs</h2><div class="sr"><span>🔍</span><input id="pq" placeholder="Rechercher…" value="${esc(pq)}"><button id="pc" title="Effacer">✕</button></div><div id="plist" class="pls"></div><div class="pn"><button id="pp">Précédent</button><button id="pn">Suivant</button></div><div id="pd">${detail()}</div></div>`;

function fillList(){
  const q=pq.trim().toLowerCase();
  const f=stats().map((o,i)=>({o,r:i+1})).filter(x=>!q||x.o.p.toLowerCase().includes(q));
  const per=15,pages=Math.max(1,Math.ceil(f.length/per));
  if(pg>=pages)pg=pages-1;if(pg<0)pg=0;
  const rows=f.slice(pg*per,pg*per+per);
  $('#plist').innerHTML=rows.length?rows.map(x=>`<div class="pr${x.o.p===psel?' on':''}" data-p="${esc(x.o.p)}">${flag(x.o.p)}<b>#${x.r}</b><span>${esc(x.o.p)}</span><i>${x.o.pts.toFixed(2)}</i></div>`).join(''):'<p class="mut" style="margin:10px 0">Aucun joueur.</p>';
  $('#pp').disabled=pg==0;$('#pn').disabled=pg>=pages-1;
  $('#plist').querySelectorAll('.pr').forEach(d=>d.onclick=()=>{psel=d.dataset.p;fillList();$('#pd').innerHTML=detail()});
}
function bindPl(){
  $('#pq').oninput=e=>{pq=e.target.value;pg=0;fillList()};
  $('#pc').onclick=()=>{pq='';$('#pq').value='';pg=0;fillList()};
  $('#pp').onclick=()=>{pg--;fillList()};
  $('#pn').onclick=()=>{pg++;fillList()};
  fillList();
}

const sub=()=>`<div class="card form"><b>Comment envoyer ton record</b><ol style="margin:0;padding-left:20px"><li>Remplis le formulaire ci-dessous.</li><li>Clique sur « Soumettre le record » (le message est copié tout seul).</li><li>Colle-le aux modos sur le serveur Discord.</li><li>Les modos vérifient que la run est légit, puis l’ajoutent à la liste.</li></ol></div>
<div class="card sb"><h3>Niveau</h3><p>Le niveau sur lequel le record a été fait.</p><select id="fl"><option value="">Cliquer pour choisir</option>${S.levels.map(l=>`<option>${esc(l.name)}</option>`).join('')}</select>
<h3>Joueur</h3><p>Le joueur qui détient le record. Commence à écrire pour voir les suggestions de joueurs existants. Si c’est ta première soumission, écris ton pseudo comme tu veux qu’il apparaisse sur le site (sans tenir compte des suggestions).</p><input id="fp" list="dlp" placeholder="Écris pour voir des suggestions…"><datalist id="dlp">${allPlayers().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<h3>Progression</h3><p>La progression réalisée, en pourcentage. Seules les valeurs de 1 à 100 sont acceptées !</p><input id="fg" type="number" min="1" max="100" placeholder="ex. : 50, 98">
<h3>Vidéo</h3><p>Une vidéo qui prouve la légitimité du record. Si le record a été fait en stream mais n’a été mis en ligne nulle part ailleurs, donne un lien Twitch vers ce stream.</p><p><i>Note :</i> fais bien attention à ne soumettre que des liens valides !</p><input id="fv" placeholder="ex. : https://youtu.be/cHEGAqOgddA">
<h3>Raw footage</h3><p>La vidéo brute, non montée et non coupée, de cette complétion, mise en ligne sur un service de partage de fichiers sans compression (par ex. pas YouTube), comme Google Drive. Note : un joueur peut recevoir une exception unique pour utiliser un VOD de stream comme raw footage.</p><p>Les informations personnelles éventuellement présentes dans la raw footage (noms, conversations sensibles…) restent confidentielles entre toi et les modos.</p><p><i>Note :</i> c’est demandé pour chaque record soumis à la liste !</p><input id="fr" placeholder="ex. : https://drive.google.com/file/d/…/view">
<h3>Notes ou commentaires</h3><p>Ajoute toutes les infos supplémentaires que tu veux transmettre au modo qui recevra ta soumission.</p><textarea id="fn" rows="3" placeholder="Tes rêves et espoirs pour ce record… ou un truc comme ça"></textarea>
<p style="margin-top:22px">En soumettant le record, tu acceptes les règles de soumission du serveur.</p><button id="fb" class="btn">Soumettre le record</button>
<p id="fm" hidden style="margin-top:16px">Voici ton message. Copie-le (déjà fait si ton navigateur l’a permis) et envoie-le aux modos sur le Discord du serveur.</p><textarea id="fo" readonly rows="8" hidden></textarea></div>`;
function bindSub(){
  $('#fb').onclick=()=>{
    const lv=$('#fl').value,p=$('#fp').value.trim(),g=+$('#fg').value,v=$('#fv').value.trim();
    if(!lv||!p||!v){alert('Choisis un niveau, écris ton pseudo et ajoute le lien de la vidéo.');return}
    if(!(g>=1&&g<=100)){alert('La progression doit être un nombre entre 1 et 100.');return}
    const t=`📥 Soumission de record\nJoueur : ${p}\nNiveau : ${lv}\nProgression : ${g}%\nVidéo : ${v}\nRaw footage : ${$('#fr').value.trim()||'-'}\nNotes : ${$('#fn').value.trim()||'-'}`;
    const o=$('#fo');o.hidden=false;o.value=t;$('#fm').hidden=false;o.select();
    try{navigator.clipboard.writeText(t).then(()=>{$('#fb').textContent='Message copié ✓'})}catch(e){}
  };
}

const adm=()=>{const n=note;note='';const t=S.theme||{on:false,c1:'#ffffff',c2:'#1a1a2e',grad:false};return `${n?`<p style="margin:16px 12px;font-weight:700;color:var(--acc)">${n}</p>`:''}<div class="card form"><b>Ajouter un niveau</b><input id="an" placeholder="Nom"><input id="ac" placeholder="Créateur"><label class="mut">Image du niveau (optionnel)<br><input id="ai" type="file" accept="image/*"></label><button id="ab" class="btn">Ajouter (en bas de la liste)</button></div>
<div class="card form"><b>Ajouter un record validé</b><select id="rl">${S.levels.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join('')}</select><input id="rp" list="dla" placeholder="Pseudo du joueur"><datalist id="dla">${allPlayers().map(n=>`<option value="${esc(n)}">`).join('')}</datalist><input id="ru" placeholder="Lien de la vidéo"><input id="rg" type="number" min="1" max="100" placeholder="Progression en % (100 par défaut)"><button id="rb" class="btn">Ajouter</button></div>
<div class="card form"><b>Modifier un record</b><select id="el">${S.levels.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join('')}</select><select id="er"></select><input id="ep" placeholder="Pseudo du joueur"><input id="eu" placeholder="Lien de la vidéo"><input id="eg" type="number" min="1" max="100" placeholder="Progression en %"><label class="mut">Niveau du record<br><select id="et">${S.levels.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join('')}</select></label><button id="eb" class="btn">Enregistrer les modifications</button></div>
<div class="card"><b>Ordre, image et suppression</b>${S.levels.map((l,i)=>`<div class="row"><span>${okImg(l.img)?`<img class="th" src="${l.img}" alt="">`:''}#${i+1} ${esc(l.name)}</span><span><label class="b">🖼<input class="fi" type="file" accept="image/*" data-img="${i}"></label> <button data-u="${i}">↑</button> <button data-d="${i}">↓</button> <button data-x="${i}">✕</button></span></div>${l.records.map((r,j)=>`<div class="row sm"><span>${esc(r.p)}${isDone(r)?'':' — '+r.pct+'%'}</span><button data-r="${i}.${j}">✕</button></div>`).join('')}`).join('')}</div>
<div class="card form"><b>Pays d’un joueur</b><select id="pj">${allPlayers().map(n=>`<option>${esc(n)}</option>`).join('')}</select><select id="pcty"><option value="">Aucun pays</option>${CC.map(c=>[c,cname(c)]).sort((x,y)=>x[1].localeCompare(y[1],'fr')).map(([c,n])=>`<option value="${c}">${esc(n)}</option>`).join('')}</select><button id="pcb" class="btn">Enregistrer le pays</button></div>
<div class="card form"><b>Arrière-plan</b><label class="mut"><input type="checkbox" id="tk"${t.on?' checked':''}> Activer l’arrière-plan personnalisé</label><label class="mut">Couleur 1 <input type="color" id="c1" value="${t.c1}"></label><label class="mut"><input type="checkbox" id="tg"${t.grad?' checked':''}> Dégradé avec une 2ᵉ couleur</label><label class="mut">Couleur 2 <input type="color" id="c2" value="${t.c2}"></label></div>
<div style="margin:0 12px"><button id="pub" class="btn" style="width:100%">Télécharger la page mise à jour</button></div>`};

function bindAdm(){
  $('#ab').onclick=async()=>{
    const n=$('#an').value.trim();if(!n)return;
    let img='';const f=$('#ai').files[0];
    if(f){try{img=await shrink(f)}catch(e){alert('Image illisible, essaie un JPG ou un PNG.')}}
    note='Niveau ajouté ✓ — clique sur « Télécharger la page mise à jour », puis remets le fichier sur ton hébergeur.';
    S.levels.push({name:n,creator:$('#ac').value.trim()||'?',img,records:[]});render();
  };
  $('#rb').onclick=()=>{
    const p=$('#rp').value.trim(),u=$('#ru').value.trim(),g=+$('#rg').value||100;
    if(!p||!u||!S.levels.length)return;
    if(g<1||g>100){alert('La progression doit être entre 1 et 100.');return}
    const r={p,url:u};if(g<100)r.pct=g;
    S.levels[+$('#rl').value].records.push(r);render();
  };
  const lo=()=>S.levels[+$('#el').value];
  const fillF=()=>{const l=lo(),r=l&&l.records[+$('#er').value];$('#ep').value=r?r.p:'';$('#eu').value=r?r.url:'';$('#eg').value=r?(isDone(r)?100:r.pct):'';$('#et').value=$('#el').value};
  const fillR=()=>{const l=lo();$('#er').innerHTML=l?l.records.map((r,j)=>`<option value="${j}">${esc(r.p)}${isDone(r)?'':' ('+r.pct+'%)'}</option>`).join(''):'';fillF()};
  $('#el').onchange=fillR;$('#er').onchange=fillF;fillR();
  $('#eb').onclick=()=>{
    const l=lo(),j=+$('#er').value,r=l&&l.records[j];if(!r)return;
    const p=$('#ep').value.trim(),u=$('#eu').value.trim(),g=+$('#eg').value||100,old=r.p.trim();
    if(!p||!u||g<1||g>100){alert('Vérifie le pseudo, le lien et la progression (1 à 100).');return}
    const n={p,url:u};if(g<100)n.pct=g;
    l.records.splice(j,1);S.levels[+$('#et').value].records.push(n);
    if(old!==p&&S.players&&S.players[old]&&!allPlayers().includes(old)){if(!S.players[p])S.players[p]=S.players[old];delete S.players[old]}
    note='Record modifié ✓ — clique sur « Télécharger la page mise à jour », puis remets le fichier sur ton hébergeur.';render();
  };
  document.querySelectorAll('[data-img]').forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{S.levels[+inp.dataset.img].img=await shrink(f);note='Image ajoutée ✓ — clique sur « Télécharger la page mise à jour », puis remets le fichier sur ton hébergeur.';render()}catch(e){alert('Image illisible, essaie un JPG ou un PNG.')}});
  document.querySelectorAll('[data-u],[data-d],[data-x],[data-r]').forEach(b=>b.onclick=()=>{
    const d=b.dataset,L=S.levels;
    if(d.u!=null){const i=+d.u;if(i>0)[L[i-1],L[i]]=[L[i],L[i-1]]}
    else if(d.d!=null){const i=+d.d;if(i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]]}
    else if(d.x!=null){L.splice(+d.x,1)}
    else if(d.r!=null){const[i,j]=d.r.split('.').map(Number);L[i].records.splice(j,1)}
    render();
  });
  const selC=()=>{$('#pcty').value=cc($('#pj').value)};
  $('#pj').onchange=selC;selC();
  $('#pcb').onclick=()=>{const p=$('#pj').value;if(!p)return;S.players=S.players||{};const c=$('#pcty').value;if(c)S.players[p]={c};else delete S.players[p];note='Pays enregistré ✓ — clique sur « Télécharger la page mise à jour », puis remets le fichier sur ton hébergeur.';render()};
  const T=()=>S.theme||(S.theme={on:false,c1:'#ffffff',c2:'#1a1a2e',grad:false});
  $('#tk').onchange=e=>{T().on=e.target.checked;applyTheme(true)};
  $('#tg').onchange=e=>{const t=T();t.grad=e.target.checked;if(t.grad){t.on=true;$('#tk').checked=true}applyTheme(true)};
  $('#c1').oninput=e=>{const t=T();t.c1=e.target.value;t.on=true;$('#tk').checked=true;applyTheme(true)};
  $('#c2').oninput=e=>{const t=T();t.c2=e.target.value;t.on=true;t.grad=true;$('#tk').checked=true;$('#tg').checked=true;applyTheme(true)};
  $('#pub').onclick=save;
}

const okC=h=>/^#[0-9a-f]{6}$/i.test(h||'');
function viewerTheme(){try{const t=JSON.parse(localStorage.getItem('vltra-theme')||'null');return t&&okC(t.c1)&&okC(t.c2)?t:null}catch(e){return null}}
function setViewerTheme(t){try{t?localStorage.setItem('vltra-theme',JSON.stringify(t)):localStorage.removeItem('vltra-theme')}catch(e){}}
function applyTheme(site){
  const t=(!site&&viewerTheme())||S.theme,r=document.documentElement.style;
  ['--fg','--mut','--card','--bd','color-scheme'].forEach(k=>r.removeProperty(k));
  document.body.style.background='';
  if(!t||!t.on||!okC(t.c1)||!okC(t.c2))return;
  const lum=h=>{const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255};
  const dark=(lum(t.c1)+(t.grad?lum(t.c2):lum(t.c1)))/2<0.5;
  r.setProperty('--fg',dark?'#f5f5f5':'#222');
  r.setProperty('--mut',dark?'#c4c4d0':'#555');
  r.setProperty('--card',dark?'rgba(255,255,255,.08)':'rgba(255,255,255,.7)');
  r.setProperty('--bd',dark?'#8a8a9a':'#888');
  r.setProperty('color-scheme',dark?'dark':'light');
  document.body.style.background=t.grad?`linear-gradient(160deg,${t.c1},${t.c2}) fixed`:t.c1;
}
function save(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.querySelector('#skin').innerHTML='';c.removeAttribute('style');c.querySelector('body').removeAttribute('style');
  c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  const bl=new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html'});
  const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='index.html';
  document.body.appendChild(l);l.click();l.remove();
}

function render(){
  const tabs=[['lvl','Liste'],['pl','Joueurs'],['sub','Soumettre']].concat(admin?[['adm','Modos']]:[]);
  let h='<div class="logo">VLTRA<span> Demonlist</span></div><nav>'+tabs.map(([k,n])=>`<button class="tab ${tab==k?'on':''}" data-t="${k}">${n}</button>`).join('')+'</nav>';
  h+=tab=='lvl'?lvl():tab=='pl'?pl():tab=='sub'?sub():adm();
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  if(tab=='pl')bindPl();
  if(tab=='sub')bindSub();
  if(tab=='adm')bindAdm();
}

function skin(){
  const el=$('#skin'),v=viewerTheme()||S.theme||{c1:'#ffffff',c2:'#1a1a2e',grad:false};
  const P=[['Blanc','#ffffff','#ffffff',0],['Noir','#111118','#111118',0],['Bleu nuit','#0d1b3d','#1f4e8c',1],['Violet','#2b0a4a','#8a2be2',1],['Bordeaux','#3a0a12','#c2185b',1],['Vert','#062b1f','#0f8a5f',1]];
  el.innerHTML=`<button id="skb" class="skb" title="Changer l’arrière-plan">🎨</button><div id="skp" class="sp" hidden><b>Ton arrière-plan</b><div class="sw">${P.map((p,i)=>`<button data-p="${i}" title="${p[0]}" style="background:${p[3]?`linear-gradient(160deg,${p[1]},${p[2]})`:p[1]}"></button>`).join('')}</div><label>Couleur 1 <input type="color" id="sc1" value="${v.c1}"></label><label><span>Dégradé</span><input type="checkbox" id="sg"${v.grad?' checked':''}></label><label>Couleur 2 <input type="color" id="sc2" value="${v.c2}"></label><button id="sr">Revenir au fond du site</button></div>`;
  const set=t=>{setViewerTheme(t);applyTheme()};
  const cur=()=>({on:true,c1:$('#sc1').value,c2:$('#sc2').value,grad:$('#sg').checked});
  $('#skb').onclick=()=>{$('#skp').hidden=!$('#skp').hidden};
  $('#sc1').oninput=()=>set(cur());
  $('#sg').onchange=()=>set(cur());
  $('#sc2').oninput=()=>{$('#sg').checked=true;set(cur())};
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=P[+b.dataset.p];$('#sc1').value=p[1];$('#sc2').value=p[2];$('#sg').checked=!!p[3];set(cur())});
  $('#sr').onclick=()=>{setViewerTheme(null);applyTheme();const d=S.theme||{c1:'#ffffff',c2:'#1a1a2e',grad:false};$('#sc1').value=d.c1;$('#sc2').value=d.c2;$('#sg').checked=!!d.grad};
}
admin=/admin/.test(location.search+location.hash);
applyTheme();
render();
skin();
</script>


</body></html>
